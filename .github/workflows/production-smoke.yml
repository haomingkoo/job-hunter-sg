name: Production acceptance

on:
  # Start from Railway's deployment report, not CI. Railway's Wait for CI
  # holds a deploy until every check on the commit ends, so a check that waits
  # for that deploy times out and Railway skips it.
  deployment_status:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full Git SHA that production must serve
        required: true
      base_url:
        description: Production URL
        required: true
        default: https://job.kooexperience.com

permissions:
  contents: read

concurrency:
  group: production-acceptance-job-hunter-sg-production
  cancel-in-progress: true

jobs:
  public-smoke:
    name: Exact-commit public smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (endsWith(github.event.deployment.environment, '/ production') &&
      contains(fromJSON('["success","failure","error"]'), github.event.deployment_status.state))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: ${{ github.event.inputs.base_url || 'https://job.kooexperience.com' }}
      EXPECTED_SHA: ${{ github.event.inputs.expected_sha || github.event.deployment.sha }}
    steps:
      - name: Fail when Railway reports a failed deploy
        if: github.event_name == 'deployment_status' && github.event.deployment_status.state != 'success'
        env:
          DEPLOY_STATE: ${{ github.event.deployment_status.state }}
        run: |
          echo "Railway reported $DEPLOY_STATE for $EXPECTED_SHA"
          exit 1

      - name: Check out verifier
        uses: actions/checkout@v7
        with:
          # Manual rollback checks need today's verifier even when the deployed
          # commit predates this script. Automatic checks still run that release's code.
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.EXPECTED_SHA }}

      - name: Wait for and verify exact production commit
        run: |
          set -euo pipefail
          python backend/scripts/verify_production.py \
            "$BASE_URL" "$EXPECTED_SHA" --wait-seconds 900 \
            > production-receipt.json
          cat production-receipt.json
          {
            echo '### Production receipt'
            echo '```json'
            cat production-receipt.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
