name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, type check, tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: sqlite:///./ci_test.db
      POSTGRES_MIGRATION_TEST_URL: postgresql://postgres:postgres@localhost:5432/job_hunter_test # pragma: allowlist secret
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres # pragma: allowlist secret
          POSTGRES_DB: job_hunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d job_hunter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Check maintainer documentation
        run: python scripts/check_docs.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt pip-audit pytest ruff==0.15.20 ty==0.0.56

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Validate semantic corpus label coverage
        run: >-
          python backend/scripts/check_semantic_corpus_labels.py
          --manifest backend/evals/corpora/synthetic-v1/manifest.json
          --corpus-dir backend/evals/corpora/synthetic-v1
          --minimum-labelled-cases 1
          --minimum-labels 2

      - name: Ruff critical checks
        run: ruff check backend tests

      - name: ty baseline type check
        run: ty check --output-format github

      - name: Backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests tests -q

      - name: Build scheduled alert image
        run: docker build --file Dockerfile.alerts --tag job-hunter-sg-alerts-ci:${{ github.sha }} .

      - name: Build scheduled crawler image
        run: docker build --file Dockerfile.crawler --tag job-hunter-sg-crawler-ci:${{ github.sha }} .

      - name: Run semantic job-ranking regression
        run: >-
          docker run --rm --entrypoint python
          job-hunter-sg-crawler-ci:${{ github.sha }}
          -m scripts.evaluate_job_ranking

      - name: Run recruitment ranking integrity evaluation
        run: >-
          docker run --rm --entrypoint python
          job-hunter-sg-crawler-ci:${{ github.sha }}
          -m scripts.evaluate_recruitment_ranking_integrity

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build production web image
        run: docker build --file Dockerfile --tag job-hunter-sg-web-ci:${{ github.sha }} .

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
