name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality:
    name: Backend lint, type check, tests
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: sqlite:///./ci_test.db
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Check maintainer documentation
        run: python scripts/check_docs.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt -r backend/requirements-test.txt pip-audit pytest ruff==0.15.20 ty==0.0.56

      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt

      - name: Compile backend
        run: python -m compileall -q backend

      - name: Ruff critical checks
        run: ruff check backend tests

      - name: ty baseline type check
        run: ty check --output-format github

      - name: Backend tests
        run: PYTHONPATH=backend python -m pytest backend/tests tests -q

  frontend-build:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Test frontend
        working-directory: frontend
        run: npm test -- --run

      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
