version: 2

# One PR per ecosystem a week for patch and minor bumps (auto-merged once checks pass, see
# workflows/dependabot-auto-merge.yml) and one for majors (merged by hand). Ecosystems run on
# different days so each PR merges before the next opens and none is left behind main.
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
    groups:
      js-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      js-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
      day: tuesday
      time: "10:00"
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      python-major:
        patterns: ["*"]
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "10:00"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      actions-major:
        patterns: ["*"]
        update-types: [major]
