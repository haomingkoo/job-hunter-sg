[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "backend/.venv",
    "frontend/node_modules",
    "frontend/dist",
]

[tool.ruff.lint]
# Baseline lint: catch syntax errors and undefined names without turning the
# current codebase into a noisy style migration.
select = ["E9", "F63", "F7", "F82"]
